[tool.poetry]
name = "homework"
version = "0.1.0"
description = ""
authors = [
    "vadimko4 "
]


[tool.poetry.dependencies]
python = ">=3.13"


[tool.poetry.group.lint.dependencies]
flake8 = "^7.1.1"
mypy = "^1.14.1"
isort = "^5.13.2"
black = "^24.10.0"


[tool.black]
line-length = 119
exclude ='''
(
  /(
    | \.git
  )
)'''


[tool.isort]
line_length = 119


[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = 'venv'


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
